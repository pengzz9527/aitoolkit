{{ define "main" }}
<div class="container" style="padding: 40px 0;">
  <h1 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 24px;">{{ .Title }}</h1>
  <div class="tool-grid">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="tool-card">
      <span class="tool-icon">{{ with .Params.icon }}{{ . }}{{ else }}🔧{{ end }}</span>
      <div class="tool-info">
        <h3>{{ .Title }}</h3>
        <p>{{ .Description }}</p>
        <span class="tool-tag">免费在线使用</span>
      </div>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
