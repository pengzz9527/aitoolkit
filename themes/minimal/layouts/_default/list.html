{{ define "main" }}
<div class="container" style="padding: 40px 20px;">
  <h1>{{ .Title }}</h1>
  <div class="tool-grid">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="tool-card">
      <span class="tool-icon">{{ with .Params.icon }}{{ . }}{{ else }}🔧{{ end }}</span>
      <h3>{{ .Title }}</h3>
      <p>{{ .Description }}</p>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
