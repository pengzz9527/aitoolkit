<!-- Docker Compose YAML 格式检查 Widget -->
<label style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:6px;">📋 Docker Compose YAML</label>
<textarea id="dcl-input" class="tool-textarea" placeholder="在此粘贴 docker-compose.yml 内容..." rows="8">version: '3.8'
services:
  web:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:</textarea>
<div class="btn-row">
  <button class="btn" onclick="lintDockerCompose()">🔍 检查</button>
  <button class="btn btn-outline btn-sm" onclick="clearDcl()">🗑️ 清空</button>
  <button class="btn btn-outline btn-sm" id="dcl-copy-btn" onclick="copyDclOutput()">📋 复制结果</button>
</div>
<pre class="output-area" id="dcl-output"></pre>
<div class="stats-bar" id="dcl-stats"></div>
<script>
function _dclCheck(obj, path){
  var issues = [];
  for(var key in obj){
    var val = obj[key];
    var curPath = path ? path+'.'+key : key;
    if(typeof val === 'object' && val !== null && !Array.isArray(val)){
      var sub = _dclCheck(val, curPath);
      issues = issues.concat(sub);
    }
  }
  return issues;
}

function lintDockerCompose(){
  var input = document.getElementById('dcl-input').value.trim();
  var out = document.getElementById('dcl-output');
  var stats = document.getElementById('dcl-stats');
  if(!input){out.textContent='⚠️ 请输入 YAML 数据';stats.textContent='';return;}
  try {
    // Simple YAML parser (handles basic docker-compose structures)
    var lines = input.split(String.fromCharCode(10));
    var obj = {};
    var stack = [{obj: obj, indent: -1, key: ''}];
    var errors = [];
    var warnings = [];
    var info = [];

    for(var i=0;i<lines.length;i++){
      var line = lines[i];
      var trimmed = line.trim();
      if(!trimmed || trimmed.indexOf('#')===0) continue;
      var indent = line.search(/\S/);
      if(indent<0) continue;

      // Pop stack back to correct level
      while(stack.length>1 && stack[stack.length-1].indent >= indent){
        stack.pop();
      }

      var currentObj = stack[stack.length-1].obj;

      if(trimmed.indexOf(':')>=0){
        var colonIdx = trimmed.indexOf(':');
        var key = trimmed.substring(0,colonIdx).trim();
        var val = trimmed.substring(colonIdx+1).trim();

        if(key.indexOf('"')===0||key.indexOf("'")===0){
          key = key.substring(1,key.length-1);
        }

        if(val === ''){
          // New nested object
          if(!currentObj[key]) currentObj[key] = {};
          stack.push({obj: currentObj[key], indent: indent, key: key});
        } else {
          // Value
          if(val.indexOf('"')===0&&val.lastIndexOf('"')===val.length-1){
            val = val.substring(1,val.length-1);
          } else if(val.indexOf("'")===0&&val.lastIndexOf("'")===val.length-1){
            val = val.substring(1,val.length-1);
          } else if(val==='true'||val==='false'){
            val = val==='true';
          } else if(val==='null'||val==='~'){
            val = null;
          } else if(!isNaN(parseFloat(val))){
            val = parseFloat(val);
          }
          currentObj[key] = val;
        }
      } else if(trimmed.indexOf('- ')===0){
        // Array item
        var arrVal = trimmed.substring(2).trim();
        if(!Array.isArray(currentObj)) {
          // Find parent array key
          for(var pk in stack[stack.length-2].obj){
            if(typeof stack[stack.length-2].obj[pk]==='object'&&stack[stack.length-2].obj[pk]===currentObj){
              var arr = [];
              stack[stack.length-2].obj[pk] = arr;
              currentObj = arr;
              stack[stack.length-1].obj = arr;
              break;
            }
          }
        }
        if(Array.isArray(currentObj)){
          if(arrVal.indexOf(':')>=0){
            var acIdx = arrVal.indexOf(':');
            var aKey = arrVal.substring(0,acIdx).trim();
            var aVal = arrVal.substring(acIdx+1).trim();
            var item = {};
            item[aKey] = aVal || {};
            currentObj.push(item);
            if(!aVal) stack.push({obj: item[aKey], indent: indent+2, key: aKey});
          } else {
            currentObj.push(arrVal);
          }
        }
      }
    }

    // Now validate
    if(!obj.version && !obj.services){
      errors.push('⚠️ 缺少必需字段: version 或 services');
    }
    if(obj.version){
      var vStr = String(obj.version);
      var validVersions = ['1','2','2.0','2.1','2.2','2.3','2.4','3','3.0','3.1','3.2','3.3','3.4','3.5','3.6','3.7','3.8','3.9'];
      if(validVersions.indexOf(vStr)<0){
        warnings.push('⚠️ version "'+vStr+'" 可能不是标准版本（建议: 3.8/3.9）');
      }
      info.push('✅ version: '+vStr);
    }
    if(!obj.services){
      errors.push('❌ 缺少 services 字段 - Compose 文件必须定义服务');
    }
    if(obj.services){
      var svcCount = Object.keys(obj.services).length;
      info.push('📦 服务数: '+svcCount);
      for(var srv in obj.services){
        var srvObj = obj.services[srv];
        if(!srvObj.image && !srvObj.build){
          warnings.push('⚠️ 服务 "'+srv+'" 未指定 image 或 build');
        }
        if(srvObj.ports && Array.isArray(srvObj.ports)){
          srvObj.ports.forEach(function(p,pi){
            if(typeof p==='string'&&p.indexOf(':')>=0){
              var parts = p.split(':');
              if(parts.length>3) warnings.push('⚠️ 服务 "'+srv+'" ports['+pi+'] 格式可能异常: '+p);
            }
          });
        }
      }
    }
    if(obj.volumes){
      info.push('💾 卷数: '+Object.keys(obj.volumes).length);
    }
    if(obj.networks){
      info.push('🌐 网络数: '+Object.keys(obj.networks).length);
    }

    // Output
    var output = '';
    if(errors.length>0){
      output += '❌ 检查发现问题:\n'+errors.join('\n')+'\n\n';
    }
    if(warnings.length>0){
      output += '⚠️ 警告:\n'+warnings.join('\n')+'\n\n';
    }
    if(info.length>0){
      output += 'ℹ️ 信息:\n'+info.join('\n')+'\n\n';
    }
    if(errors.length===0 && warnings.length===0){
      output = '✅ 格式检查通过！\n\nCompose 文件结构基本正确。\n';
      if(info.length>0) output += '\n'+info.join('\n');
    } else {
      output += '💡 提示: 以上检查为基础验证，请参考 Docker Compose 官方文档确认详细规范。';
    }
    out.textContent = output;
    stats.innerHTML = '<span>📋 YAML 长度: '+input.length+' 字符</span><span>📃 '+(obj.services?Object.keys(obj.services).length+' 个服务':'')+'</span>';
  } catch(e){
    out.textContent = '❌ 解析失败: '+e.message+'\n\n请检查 YAML 缩进和格式是否正确。';
    stats.textContent = '';
  }
}

function clearDcl(){
  document.getElementById('dcl-input').value='';
  document.getElementById('dcl-output').textContent='';
  document.getElementById('dcl-stats').textContent='';
}

function copyDclOutput(){
  var text=document.getElementById('dcl-output').textContent;
  if(!text||text.indexOf('⚠️')===0)return;
  navigator.clipboard.writeText(text).then(function(){var b=document.getElementById('dcl-copy-btn');b.textContent='✅ 已复制';setTimeout(function(){b.textContent='📋 复制结果';},2000);}).catch(function(){});
}
</script>
<div class="tool-meta">
  <p><strong>使用说明：</strong>粘贴 docker-compose.yml 内容，检查 YAML 格式、必需字段（services）、版本号合理性等。</p>
  <p><strong>检查项：</strong>YAML 缩进语法、version 版本号、services 必需字段、image/build 配置、ports 格式、volumes/networks 定义。</p>
  <p><strong>适用场景：</strong>Docker Compose 配置调试、部署前检查、团队协作代码审查。</p>
</div>
