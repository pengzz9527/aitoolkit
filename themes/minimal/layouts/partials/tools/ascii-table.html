<!-- ASCII Table Widget -->
<div class="tool-widget">
  <div style="margin-bottom:14px;">
    <label style="font-size:0.82rem;font-weight:600;display:block;margin-bottom:4px;">🔍 搜索 ASCII 字符（名称、符号或十进制值）</label>
    <input type="text" id="ascii-search" class="tool-textarea" style="min-height:auto;padding:10px 14px;" value="" placeholder="输入搜索关键词，如 'A'、'65'、'space' 或留空显示全部...">
  </div>

  <div class="btn-row">
    <button class="btn" onclick="renderASCII()">🔍 搜索</button>
    <button class="btn btn-outline btn-sm" onclick="clearASCII()">🗑️ 清空搜索</button>
    <button class="btn btn-outline btn-sm" onclick="filterASCII('control')">🛠️ 控制字符</button>
    <button class="btn btn-outline btn-sm" onclick="filterASCII('printable')">🔤 可打印字符</button>
    <button class="btn btn-outline btn-sm" onclick="filterASCII('extended')">🔣 扩展字符</button>
    <button class="btn btn-outline btn-sm" id="ascii-copy-btn" onclick="copyASCII()">📋 复制表格</button>
  </div>

  <div style="margin-top:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="font-size:0.82rem;font-weight:600;">📋 ASCII 码表</span>
      <span style="font-size:0.75rem;color:var(--text-secondary);" id="ascii-count">显示 0/128 个字符</span>
    </div>
    <div id="ascii-table-container" style="max-height:420px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--bg);">
      <table style="width:100%;border-collapse:collapse;font-size:0.78rem;font-family:var(--font-mono);">
        <thead>
          <tr style="background:var(--border);position:sticky;top:0;">
            <th style="padding:8px 6px;text-align:center;border-bottom:1px solid var(--border);">Dec</th>
            <th style="padding:8px 6px;text-align:center;border-bottom:1px solid var(--border);">Hex</th>
            <th style="padding:8px 6px;text-align:center;border-bottom:1px solid var(--border);">Bin</th>
            <th style="padding:8px 6px;text-align:center;border-bottom:1px solid var(--border);">Char</th>
            <th style="padding:8px 6px;text-align:left;border-bottom:1px solid var(--border);">描述</th>
          </tr>
        </thead>
        <tbody id="ascii-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
var _asciiChars = [];

function initASCII() {
  var controlNames = [
    'NUL (空字符)', 'SOH (标题开始)', 'STX (正文开始)', 'ETX (正文结束)',
    'EOT (传输结束)', 'ENQ (询问)', 'ACK (确认)', 'BEL (响铃)',
    'BS (退格)', 'HT (水平制表符)', 'LF (换行)', 'VT (垂直制表符)',
    'FF (换页)', 'CR (回车)', 'SO (移出)', 'SI (移入)',
    'DLE (数据链路转义)', 'DC1 (设备控制1/XON)', 'DC2 (设备控制2)', 'DC3 (设备控制3/XOFF)',
    'DC4 (设备控制4)', 'NAK (否定确认)', 'SYN (同步空闲)', 'ETB (块传输结束)',
    'CAN (取消)', 'EM (介质中断)', 'SUB (替换)', 'ESC (转义)',
    'FS (文件分隔符)', 'GS (组分隔符)', 'RS (记录分隔符)', 'US (单元分隔符)',
    'SP (空格)'
  ];

  _asciiChars = [];
  for (var i = 0; i < 128; i++) {
    var ch, desc;
    if (i < 32) {
      ch = '␀'; // Use control picture
      desc = controlNames[i] || '控制字符';
    } else if (i === 32) {
      ch = '␣';
      desc = 'SP (空格)';
    } else if (i === 127) {
      ch = '␡';
      desc = 'DEL (删除)';
    } else {
      ch = String.fromCharCode(i);
      desc = getCharName(i);
    }
    _asciiChars.push({ dec: i, hex: i.toString(16).toUpperCase().padStart(2, '0'), bin: i.toString(2).padStart(8, '0'), char: ch, desc: desc });
  }
}

function getCharName(code) {
  var names = {
    33: '! 感叹号', 34: '" 双引号', 35: '# 井号', 36: '$ 美元符号',
    37: '% 百分号', 38: '& 和号', 39: '\' 单引号', 40: '( 左括号',
    41: ') 右括号', 42: '* 星号', 43: '+ 加号', 44: ', 逗号',
    45: '- 连字符/减号', 46: '. 句号', 47: '/ 斜杠',
    48: '0 数字零', 49: '1 数字一', 50: '2 数字二', 51: '3 数字三',
    52: '4 数字四', 53: '5 数字五', 54: '6 数字六', 55: '7 数字七',
    56: '8 数字八', 57: '9 数字九',
    58: ': 冒号', 59: '; 分号', 60: '< 小于号', 61: '= 等号',
    62: '> 大于号', 63: '? 问号', 64: '@ @符号',
    65: 'A', 66: 'B', 67: 'C', 68: 'D', 69: 'E', 70: 'F', 71: 'G',
    72: 'H', 73: 'I', 74: 'J', 75: 'K', 76: 'L', 77: 'M', 78: 'N',
    79: 'O', 80: 'P', 81: 'Q', 82: 'R', 83: 'S', 84: 'T', 85: 'U',
    86: 'V', 87: 'W', 88: 'X', 89: 'Y', 90: 'Z',
    91: '[ 左中括号', 92: '\\ 反斜杠', 93: '] 右中括号', 94: '^ 脱字符',
    95: '_ 下划线', 96: '` 反引号',
    97: 'a', 98: 'b', 99: 'c', 100: 'd', 101: 'e', 102: 'f', 103: 'g',
    104: 'h', 105: 'i', 106: 'j', 107: 'k', 108: 'l', 109: 'm', 110: 'n',
    111: 'o', 112: 'p', 113: 'q', 114: 'r', 115: 's', 116: 't', 117: 'u',
    118: 'v', 119: 'w', 120: 'x', 121: 'y', 122: 'z',
    123: '{ 左花括号', 124: '| 竖线', 125: '} 右花括号', 126: '~ 波浪号',
    127: 'DEL (删除)'
  };
  return names[code] || '可打印字符';
}

function renderASCII() {
  var query = document.getElementById('ascii-search').value.trim().toLowerCase();
  var tbody = document.getElementById('ascii-tbody');
  var countEl = document.getElementById('ascii-count');

  var filtered = [];
  for (var i = 0; i < _asciiChars.length; i++) {
    var c = _asciiChars[i];
    if (!query) {
      filtered.push(c);
    } else {
      var decMatch = c.dec.toString() === query;
      var hexMatch = c.hex.toLowerCase() === query || c.hex.toLowerCase() === '0x' + query;
      var charMatch = c.char.toLowerCase() === query || c.char.toLowerCase().includes(query);
      var descMatch = c.desc.toLowerCase().indexOf(query) >= 0;
      if (decMatch || hexMatch || charMatch || descMatch) {
        filtered.push(c);
      }
    }
  }

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var c = filtered[i];
    var rowClass = (c.dec < 32 || c.dec === 127) ? ' style="color:var(--text-secondary);"' : '';
    var charDisplay = c.dec === 32 ? '␣' : c.char;
    if (c.dec >= 33 && c.dec <= 126) {
      charDisplay = c.char;
    }
    html += '<tr' + rowClass + '>' +
      '<td style="padding:5px 6px;text-align:center;border-bottom:1px solid var(--border);">' + c.dec + '</td>' +
      '<td style="padding:5px 6px;text-align:center;border-bottom:1px solid var(--border);">0x' + c.hex + '</td>' +
      '<td style="padding:5px 6px;text-align:center;border-bottom:1px solid var(--border);font-size:0.7rem;">' + c.bin + '</td>' +
      '<td style="padding:5px 6px;text-align:center;border-bottom:1px solid var(--border);font-size:1rem;font-weight:600;">' + (c.dec >= 33 && c.dec <= 126 ? c.char : '') + '</td>' +
      '<td style="padding:5px 6px;text-align:left;border-bottom:1px solid var(--border);">' + c.desc + '</td>' +
      '</tr>';
  }
  tbody.innerHTML = html;
  countEl.textContent = '显示 ' + filtered.length + '/' + _asciiChars.length + ' 个字符';
}

function clearASCII() {
  document.getElementById('ascii-search').value = '';
  renderASCII();
}

function filterASCII(type) {
  var query = '';
  switch(type) {
    case 'control':
      query = '控制字符';
      break;
    case 'printable':
      document.getElementById('ascii-search').value = '';
      renderASCII();
      return;
    case 'extended':
      // We only show 0-127 in standard ASCII
      break;
  }
  document.getElementById('ascii-search').value = query;
  renderASCII();
}

function copyASCII() {
  var rows = document.querySelectorAll('#ascii-tbody tr');
  var text = 'Dec\tHex\tBin\tChar\tDescription\n';
  for (var i = 0; i < rows.length; i++) {
    var cells = rows[i].querySelectorAll('td');
    var rowText = '';
    for (var j = 0; j < cells.length; j++) {
      rowText += cells[j].textContent.trim() + '\t';
    }
    text += rowText.trim() + '\n';
  }
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.getElementById('ascii-copy-btn');
    btn.textContent = '✅ 已复制';
    setTimeout(function() { btn.textContent = '📋 复制表格'; }, 2000);
  }).catch(function() {});
}

initASCII();
renderASCII();

document.getElementById('ascii-search').addEventListener('input', renderASCII);
</script>

<div class="tool-meta">
  <p><strong>使用说明：</strong>搜索 ASCII 字符（按名称、符号或十进制值），或浏览完整 ASCII 码表。</p>
  <p><strong>表格内容：</strong>十进制(Dec)、十六进制(Hex)、二进制(Bin)、字符(Char)、描述。</p>
  <p><strong>快捷筛选：</strong>控制字符(0-31)、可打印字符(32-126)、DEL(127)。</p>
  <p><strong>适用场景：</strong>编程开发、网络协议分析、字符编码调试、计算机原理学习。</p>
</div>
