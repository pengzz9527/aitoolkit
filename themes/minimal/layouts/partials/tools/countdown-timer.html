<!-- Countdown Timer Widget -->
<div class="tool-widget">
  <div style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end;">
    <div style="flex:1;min-width:200px;">
      <label style="font-size:0.82rem;font-weight:600;display:block;margin-bottom:4px;">🎯 目标日期时间</label>
      <input type="datetime-local" id="cd-datetime" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:0.88rem;background:var(--bg);color:var(--text);">
    </div>
    <div style="flex:0 0 140px;">
      <label style="font-size:0.82rem;font-weight:600;display:block;margin-bottom:4px;">📝 事件名称</label>
      <input type="text" id="cd-event-name" class="tool-textarea" style="min-height:auto;padding:10px 12px;" value="新年倒计时" placeholder="输入事件名称...">
    </div>
  </div>

  <div class="btn-row">
    <button class="btn" onclick="startCD()">▶️ 开始倒计时</button>
    <button class="btn btn-outline btn-sm" onclick="stopCD()">⏹️ 停止</button>
    <button class="btn btn-outline btn-sm" onclick="setCDPreset('newyear')">🎆 新年</button>
    <button class="btn btn-outline btn-sm" onclick="setCDPreset('christmas')">🎄 圣诞</button>
    <button class="btn btn-outline btn-sm" onclick="setCDPreset('newyear2030')">🔟 2030年</button>
  </div>

  <div id="cd-display" style="margin:20px 0;text-align:center;">
    <div style="font-size:0.9rem;font-weight:600;color:var(--text-secondary);margin-bottom:12px;" id="cd-event-label">⏳ 距离 新年倒计时</div>
    <div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;">
      <div style="background:var(--bg);border-radius:var(--radius-sm);padding:16px 20px;min-width:80px;border:1px solid var(--border);">
        <div id="cd-days" style="font-size:2.2rem;font-weight:800;color:var(--primary);line-height:1.2;">00</div>
        <div style="font-size:0.75rem;color:var(--text-secondary);">天</div>
      </div>
      <div style="background:var(--bg);border-radius:var(--radius-sm);padding:16px 20px;min-width:80px;border:1px solid var(--border);">
        <div id="cd-hours" style="font-size:2.2rem;font-weight:800;color:var(--primary);line-height:1.2;">00</div>
        <div style="font-size:0.75rem;color:var(--text-secondary);">时</div>
      </div>
      <div style="background:var(--bg);border-radius:var(--radius-sm);padding:16px 20px;min-width:80px;border:1px solid var(--border);">
        <div id="cd-mins" style="font-size:2.2rem;font-weight:800;color:var(--primary);line-height:1.2;">00</div>
        <div style="font-size:0.75rem;color:var(--text-secondary);">分</div>
      </div>
      <div style="background:var(--bg);border-radius:var(--radius-sm);padding:16px 20px;min-width:80px;border:1px solid var(--border);">
        <div id="cd-secs" style="font-size:2.2rem;font-weight:800;color:var(--primary);line-height:1.2;">00</div>
        <div style="font-size:0.75rem;color:var(--text-secondary);">秒</div>
      </div>
    </div>
    <div id="cd-progress-container" style="margin-top:16px;max-width:400px;margin-left:auto;margin-right:auto;">
      <div style="display:flex;justify-content:space-between;font-size:0.72rem;color:var(--text-secondary);margin-bottom:4px;">
        <span id="cd-elapsed-label">已过 0%</span>
        <span id="cd-remaining-label">剩余 100%</span>
      </div>
      <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;">
        <div id="cd-progress-bar" style="height:100%;width:0%;background:var(--primary);border-radius:3px;transition:width 0.5s;"></div>
      </div>
    </div>
    <div style="margin-top:12px;font-size:0.78rem;color:var(--text-secondary);" id="cd-time-info"></div>
  </div>
</div>

<script>
var _cdTimer = null;
var _cdStartTime = null;

function setCDPreset(preset) {
  var dtEl = document.getElementById('cd-datetime');
  var now = new Date();
  var target;
  switch(preset) {
    case 'newyear':
      target = new Date(now.getFullYear() + 1, 0, 1, 0, 0, 0);
      document.getElementById('cd-event-name').value = '🎆 新年';
      break;
    case 'christmas':
      target = new Date(now.getFullYear(), 11, 25, 0, 0, 0);
      if (target < now) target = new Date(now.getFullYear() + 1, 11, 25, 0, 0, 0);
      document.getElementById('cd-event-name').value = '🎄 圣诞节';
      break;
    case 'newyear2030':
      target = new Date(2030, 0, 1, 0, 0, 0);
      document.getElementById('cd-event-name').value = '🔟 2030年元旦';
      break;
  }
  var iso = target.getFullYear() + '-' +
    String(target.getMonth() + 1).padStart(2, '0') + '-' +
    String(target.getDate()).padStart(2, '0') + 'T' +
    String(target.getHours()).padStart(2, '0') + ':' +
    String(target.getMinutes()).padStart(2, '0');
  dtEl.value = iso;
  stopCD();
  updateCDDisplay();
}

function startCD() {
  var dtVal = document.getElementById('cd-datetime').value;
  if (!dtVal) { return; }
  var target = new Date(dtVal);
  if (isNaN(target.getTime())) { return; }

  var now = new Date();
  if (target <= now) {
    document.getElementById('cd-days').textContent = '00';
    document.getElementById('cd-hours').textContent = '00';
    document.getElementById('cd-mins').textContent = '00';
    document.getElementById('cd-secs').textContent = '00';
    document.getElementById('cd-progress-bar').style.width = '100%';
    document.getElementById('cd-elapsed-label').textContent = '✅ 倒计时已结束';
    document.getElementById('cd-remaining-label').textContent = '';
    document.getElementById('cd-time-info').textContent = '🎉 目标时间已过！';
    return;
  }

  stopCD();
  _cdStartTime = Date.now();
  _cdTargetTime = target.getTime();

  _cdTimer = setInterval(function() {
    updateCDDisplay();
  }, 200);
  updateCDDisplay();
}

var _cdTargetTime = null;

function stopCD() {
  if (_cdTimer) {
    clearInterval(_cdTimer);
    _cdTimer = null;
  }
  _cdStartTime = null;
}

function updateCDDisplay() {
  var dtVal = document.getElementById('cd-datetime').value;
  var eventName = document.getElementById('cd-event-name').value || '事件';
  document.getElementById('cd-event-label').textContent = '⏳ 距离 ' + eventName;

  if (!dtVal) {
    document.getElementById('cd-days').textContent = '--';
    document.getElementById('cd-hours').textContent = '--';
    document.getElementById('cd-mins').textContent = '--';
    document.getElementById('cd-secs').textContent = '--';
    document.getElementById('cd-time-info').textContent = '请选择目标日期时间';
    return;
  }

  var target = new Date(dtVal);
  if (isNaN(target.getTime())) return;

  var now = new Date();
  var diff = target.getTime() - now.getTime();

  if (diff <= 0) {
    document.getElementById('cd-days').textContent = '00';
    document.getElementById('cd-hours').textContent = '00';
    document.getElementById('cd-mins').textContent = '00';
    document.getElementById('cd-secs').textContent = '00';
    document.getElementById('cd-progress-bar').style.width = '100%';
    document.getElementById('cd-elapsed-label').textContent = '✅ 倒计时已结束';
    document.getElementById('cd-remaining-label').textContent = '';
    document.getElementById('cd-time-info').textContent = '🎉 目标时间已过！';
    stopCD();
    return;
  }

  var days = Math.floor(diff / (1000 * 60 * 60 * 24));
  var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  var secs = Math.floor((diff % (1000 * 60)) / 1000);

  document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
  document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
  document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
  document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');

  // Progress — need a start time. If not started, just show 0%
  if (_cdStartTime && _cdTargetTime) {
    var totalDuration = _cdTargetTime - _cdStartTime;
    var elapsed = now.getTime() - _cdStartTime;
    var pct = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
    document.getElementById('cd-progress-bar').style.width = pct + '%';
    document.getElementById('cd-elapsed-label').textContent = '已过 ' + (elapsed > 0 ? Math.round((now.getTime() - (_cdTargetTime - totalDuration)) / 1000) + 's' : '0s');
    document.getElementById('cd-remaining-label').textContent = '剩余 ' + Math.round(diff / 1000) + 's (' + Math.round(100 - pct) + '%)';
  } else {
    document.getElementById('cd-progress-bar').style.width = '0%';
    document.getElementById('cd-elapsed-label').textContent = '点击「开始倒计时」启动';
    document.getElementById('cd-remaining-label').textContent = '';
  }

  var totalHours = Math.floor(diff / (1000 * 60 * 60));
  var totalMins = Math.floor(diff / (1000 * 60));
  var totalSecs = Math.floor(diff / 1000);
  document.getElementById('cd-time-info').textContent = '⏱️ 总计: ' + days + ' 天 / ' + totalHours + ' 小时 / ' + totalMins + ' 分钟 / ' + totalSecs + ' 秒';
}

// Set default: 1 month from now
var defaultTarget = new Date();
defaultTarget.setMonth(defaultTarget.getMonth() + 1);
document.getElementById('cd-datetime').value =
  defaultTarget.getFullYear() + '-' +
  String(defaultTarget.getMonth() + 1).padStart(2, '0') + '-' +
  String(defaultTarget.getDate()).padStart(2, '0') + 'T' +
  String(defaultTarget.getHours()).padStart(2, '0') + ':' +
  String(defaultTarget.getMinutes()).padStart(2, '0');
updateCDDisplay();
</script>

<div class="tool-meta">
  <p><strong>使用说明：</strong>设置目标日期时间和事件名称 → 点击「开始倒计时」实时显示。</p>
  <p><strong>显示内容：</strong>天/时/分/秒 四位倒计时，附带进度条和总计时间。</p>
  <p><strong>快捷预设：</strong>新年、圣诞节、2030年元旦一键设置。</p>
  <p><strong>适用场景：</strong>项目截止日期、节日倒计时、生日提醒、重要事件倒数。</p>
</div>
