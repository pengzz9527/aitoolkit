<!-- Cron 表达式可视化构建器 Widget -->
<label style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:8px;">🕐 Cron 表达式构建器</label>
<div style="background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;padding:12px;margin-bottom:12px;">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
    <div>
      <label style="font-size:0.75rem;font-weight:600;display:block;margin-bottom:3px;color:var(--text-secondary);">分 (0-59)</label>
      <select id="cb-minute" class="tool-textarea" style="min-height:auto;padding:8px 10px;font-size:0.82rem;" onchange="buildCronExpr()">
        <option value="*">每分钟</option>
        <option value="0">整点 (0分)</option>
        <option value="30">每半小时 (30分)</option>
        <option value="15">每15分</option>
        <option value="*/5">每5分钟</option>
        <option value="*/10">每10分钟</option>
        <option value="*/15">每15分钟</option>
        <option value="*/30">每30分钟</option>
      </select>
    </div>
    <div>
      <label style="font-size:0.75rem;font-weight:600;display:block;margin-bottom:3px;color:var(--text-secondary);">时 (0-23)</label>
      <select id="cb-hour" class="tool-textarea" style="min-height:auto;padding:8px 10px;font-size:0.82rem;" onchange="buildCronExpr()">
        <option value="*">每小时</option>
        <option value="0">午夜 (0点)</option>
        <option value="6">早上6点</option>
        <option value="8">早上8点</option>
        <option value="9">早上9点</option>
        <option value="12">中午12点</option>
        <option value="18">下午6点</option>
        <option value="22">晚上10点</option>
        <option value="*/2">每2小时</option>
        <option value="*/3">每3小时</option>
        <option value="*/6">每6小时</option>
        <option value="*/12">每12小时</option>
        <option value="0,12">每天0点和12点</option>
      </select>
    </div>
    <div>
      <label style="font-size:0.75rem;font-weight:600;display:block;margin-bottom:3px;color:var(--text-secondary);">日 (1-31)</label>
      <select id="cb-day" class="tool-textarea" style="min-height:auto;padding:8px 10px;font-size:0.82rem;" onchange="buildCronExpr()">
        <option value="*">每天</option>
        <option value="1">每月1号</option>
        <option value="15">每月15号</option>
        <option value="1,15">每月1号和15号</option>
        <option value="*/2">每2天</option>
        <option value="*/7">每7天</option>
        <option value="L">每月最后一天</option>
      </select>
    </div>
    <div>
      <label style="font-size:0.75rem;font-weight:600;display:block;margin-bottom:3px;color:var(--text-secondary);">月 (1-12)</label>
      <select id="cb-month" class="tool-textarea" style="min-height:auto;padding:8px 10px;font-size:0.82rem;" onchange="buildCronExpr()">
        <option value="*">每月</option>
        <option value="1">一月</option>
        <option value="3">三月</option>
        <option value="6">六月</option>
        <option value="9">九月</option>
        <option value="12">十二月</option>
        <option value="*/3">每季度</option>
        <option value="*/6">每半年</option>
        <option value="1,7">一月和七月</option>
      </select>
    </div>
    <div>
      <label style="font-size:0.75rem;font-weight:600;display:block;margin-bottom:3px;color:var(--text-secondary);">周 (0-7, 0=周日)</label>
      <select id="cb-week" class="tool-textarea" style="min-height:auto;padding:8px 10px;font-size:0.82rem;" onchange="buildCronExpr()">
        <option value="*">每天</option>
        <option value="1">周一</option>
        <option value="2">周二</option>
        <option value="3">周三</option>
        <option value="4">周四</option>
        <option value="5">周五</option>
        <option value="6">周六</option>
        <option value="0">周日</option>
        <option value="1-5">工作日 (周一至周五)</option>
        <option value="0,6">周末 (周六日)</option>
      </select>
    </div>
  </div>
</div>
<div class="btn-row">
  <button class="btn btn-outline btn-sm" id="cb-copy-btn" onclick="copyCronExpr()">📋 复制表达式</button>
  <button class="btn btn-outline btn-sm" onclick="resetCronBuilder()">🔄 重置</button>
</div>
<label style="font-size:0.85rem;font-weight:600;display:block;margin:8px 0 6px;">📋 生成的 Cron 表达式</label>
<div class="output-area" id="cb-expr" style="padding:10px 14px;font-family:var(--font-mono);font-size:0.9rem;text-align:center;"></div>
<label style="font-size:0.85rem;font-weight:600;display:block;margin:8px 0 6px;">📖 中文描述</label>
<pre class="output-area" id="cb-desc" style="white-space:pre-wrap;"></pre>
<div class="stats-bar" id="cb-stats"></div>
<script>
function _cbDesc(field, name, names){
  if(field==='*') return '每'+name;
  if(field.indexOf('*/')===0) return '每'+field.split('/')[1]+name;
  if(field.indexOf('L')===0) return '每月最后一天';
  if(field.indexOf('-')>=0){
    var parts=field.split('-');
    var vals=[];
    for(var i=parseInt(parts[0]);i<=parseInt(parts[1]);i++) vals.push(i);
    if(names) return names[parts[0]]+'至'+names[parts[1]];
    return parts[0]+'到'+parts[1]+name;
  }
  if(field.indexOf(',')>=0){
    var parts=field.split(',');
    var mapped=parts.map(function(p){return names?names[parseInt(p)]||p:p;});
    return mapped.join('、');
  }
  var num=parseInt(field);
  if(names&&names[num]) return names[num];
  return '第'+num+name;
}

function buildCronExpr(){
  var minute=document.getElementById('cb-minute').value;
  var hour=document.getElementById('cb-hour').value;
  var day=document.getElementById('cb-day').value;
  var month=document.getElementById('cb-month').value;
  var week=document.getElementById('cb-week').value;
  var expr = minute+' '+hour+' '+day+' '+month+' '+week;
  document.getElementById('cb-expr').textContent = expr;

  var weekNames=['周日','周一','周二','周三','周四','周五','周六','周日'];
  var monthNames=['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  var desc='';
  desc += _cbDesc(minute,'分')+' ';
  desc += _cbDesc(hour,'时')+' ';
  desc += _cbDesc(day,'天')+' ';
  desc += _cbDesc(month,'月',monthNames)+' ';
  desc += _cbDesc(week,'周',weekNames);
  document.getElementById('cb-desc').textContent = desc;
  document.getElementById('cb-stats').innerHTML = '<span>📋 '+expr+'</span><span>⏱️ 5位标准格式</span>';
}

function copyCronExpr(){
  var text=document.getElementById('cb-expr').textContent;
  if(!text)return;
  navigator.clipboard.writeText(text).then(function(){var b=document.getElementById('cb-copy-btn');b.textContent='✅ 已复制';setTimeout(function(){b.textContent='📋 复制表达式';},2000);}).catch(function(){});
}

function resetCronBuilder(){
  document.getElementById('cb-minute').value='*';
  document.getElementById('cb-hour').value='*';
  document.getElementById('cb-day').value='*';
  document.getElementById('cb-month').value='*';
  document.getElementById('cb-week').value='*';
  buildCronExpr();
}

buildCronExpr();
</script>
<div class="tool-meta">
  <p><strong>使用说明：</strong>通过下拉菜单选择分钟、小时、日、月、周，自动生成对应的 Cron 表达式和中文描述。</p>
  <p><strong>5位格式：</strong>分 时 日 月 周（标准 Linux crontab 格式）。</p>
  <p><strong>适用场景：</strong>定时任务配置、系统运维、数据备份调度。</p>
</div>
