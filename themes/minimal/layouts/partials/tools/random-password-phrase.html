<!-- 随机密码词组生成器 Widget -->
<label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;color:var(--text);">单词数量</label>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
  <input type="range" id="rpp-count" min="2" max="10" value="4" style="flex:1;accent-color:var(--primary);" oninput="document.getElementById('rpp-count-label').textContent=this.value;rppGenerate()">
  <span id="rpp-count-label" style="font-size:0.85rem;font-weight:600;min-width:20px;text-align:center;">4</span>
</div>
<label style="display:flex;align-items:center;gap:8px;font-size:0.82rem;cursor:pointer;color:var(--text-secondary);margin-bottom:8px;">
  <input type="checkbox" id="rpp-capitalize" checked onchange="rppGenerate()"> 首字母大写
</label>
<label style="display:flex;align-items:center;gap:8px;font-size:0.82rem;cursor:pointer;color:var(--text-secondary);margin-bottom:8px;">
  <input type="checkbox" id="rpp-numbers" checked onchange="rppGenerate()"> 末尾加数字
</label>
<label style="display:flex;align-items:center;gap:8px;font-size:0.82rem;cursor:pointer;color:var(--text-secondary);margin-bottom:12px;">
  <input type="checkbox" id="rpp-separator" onchange="rppGenerate()"> 特殊字符分隔
</label>
<div class="btn-row">
  <button class="btn" onclick="rppGenerate()">🔀 生成词组</button>
  <button class="btn btn-outline btn-sm" id="rpp-copy-btn" onclick="rppCopy()">📋 复制</button>
  <button class="btn btn-outline btn-sm" onclick="rppClear()">🗑️ 清空</button>
</div>
<div class="output-area" id="rpp-output" style="font-size:1rem;text-align:center;font-weight:600;"></div>
<div class="stats-bar" id="rpp-stats"></div>
<script>
var rppWords=['apple','banana','cherry','dragon','eagle','forest','garden','hidden','island','jungle','knight','lemon','mountain','noble','ocean','piano','queen','river','silver','tiger','umbrella','velvet','winter','xenon','yellow','zebra','breeze','crystal','diamond','emerald','flame','galaxy','horizon','iceberg','jewel','koala','lantern','moonlight','nebula','orbit','pearl','quantum','rainbow','sunset','thunder','utopia','vortex','willow','aurora','blossom','cascade','dawn','echo','frost','gloom','harmony','ivory','jade','lily','meadow','nova','opal','pixel','ridge','shard','tide','unity','vivid','whisper','zenith'];
function rppGenerate(){var n=parseInt(document.getElementById('rpp-count').value);var cap=document.getElementById('rpp-capitalize').checked;var num=document.getElementById('rpp-numbers').checked;var sep=document.getElementById('rpp-separator').checked;
var phrase=[];for(var i=0;i<n;i++){var w=rppWords[Math.floor(Math.random()*rppWords.length)];if(cap)w=w.charAt(0).toUpperCase()+w.slice(1);phrase.push(w);}
var connector=sep?'-':'';var pwd=phrase.join(connector);if(num){var digits=Math.floor(Math.random()*90+10);pwd+=digits;}
document.getElementById('rpp-output').textContent=pwd;
var entropy=Math.round(n*Math.log2(rppWords.length)+(num?Math.log2(90):0));document.getElementById('rpp-stats').innerHTML='<span>🔤 单词: '+n+'</span><span>🔐 熵值: ~'+entropy+' bit</span><span>📏 长度: '+pwd.length+' 字符</span>';}
function rppCopy(){var t=document.getElementById('rpp-output').textContent;if(!t)return;navigator.clipboard.writeText(t).then(function(){var b=document.getElementById('rpp-copy-btn');b.textContent='✅ 已复制';setTimeout(function(){b.textContent='📋 复制';},2000);}).catch(function(){});}
function rppClear(){document.getElementById('rpp-output').textContent='';document.getElementById('rpp-stats').textContent='';}
rppGenerate();
</script>
<div class="tool-meta">
  <p><strong>使用说明：</strong>选择单词数量 → 勾选选项 → 自动生成易记密码词组。</p>
  <p><strong>优势：</strong>比随机字符密码更容易记忆，同时保持较高熵值。</p>
  <p><strong>隐私说明：</strong>所有生成均在本地完成。</p>
</div>
