<!-- 强密码生成器 Widget -->
<div style="margin-bottom:14px;">
  <label style="display:flex;justify-content:space-between;font-size:0.85rem;font-weight:600;margin-bottom:6px;color:var(--text);">
    <span>密码长度</span>
    <span id="pw-length-label">20</span>
  </label>
  <input type="range" id="pw-length" min="8" max="64" value="20" style="width:100%;accent-color:var(--primary);" oninput="updatePWLengthLabel();generatePW();">
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
  <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;color:var(--text);background:var(--bg);padding:8px 12px;border-radius:var(--radius-xs);border:1px solid var(--border);">
    <input type="checkbox" id="pw-upper" checked onchange="generatePW()"> <span>大写 (A-Z)</span>
  </label>
  <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;color:var(--text);background:var(--bg);padding:8px 12px;border-radius:var(--radius-xs);border:1px solid var(--border);">
    <input type="checkbox" id="pw-lower" checked onchange="generatePW()"> <span>小写 (a-z)</span>
  </label>
  <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;color:var(--text);background:var(--bg);padding:8px 12px;border-radius:var(--radius-xs);border:1px solid var(--border);">
    <input type="checkbox" id="pw-digits" checked onchange="generatePW()"> <span>数字 (0-9)</span>
  </label>
  <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;color:var(--text);background:var(--bg);padding:8px 12px;border-radius:var(--radius-xs);border:1px solid var(--border);">
    <input type="checkbox" id="pw-special" checked onchange="generatePW()"> <span>特殊字符 (!@#$%^&*)</span>
  </label>
</div>

<label style="display:flex;align-items:center;gap:8px;font-size:0.82rem;cursor:pointer;color:var(--text-secondary);margin-bottom:14px;padding:6px 0;">
  <input type="checkbox" id="pw-exclude-similar" onchange="generatePW()"> 排除相似字符 (0O, 1l, I)
</label>

<div style="margin-bottom:12px;">
  <div style="display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-secondary);margin-bottom:4px;">
    <span>密码强度</span>
    <span id="pw-strength-text">强</span>
  </div>
  <div id="pw-strength-bar" style="height:8px;border-radius:4px;background:var(--border);overflow:hidden;">
    <div id="pw-strength-fill" style="height:100%;width:85%;border-radius:4px;background:var(--primary);transition:width .3s,background .3s;"></div>
  </div>
</div>

<div class="btn-row">
  <button class="btn" onclick="generatePW()">🔀 生成密码</button>
  <button class="btn btn-outline btn-sm" id="pw-copy-btn" onclick="copyPW()">📋 复制密码</button>
  <button class="btn btn-outline btn-sm" onclick="clearPW()">🗑️ 清空</button>
</div>

<div class="output-area" id="pw-output" style="font-size:1rem;text-align:center;font-weight:600;letter-spacing:0.5px;"></div>
<div class="stats-bar" id="pw-stats"></div>

<script>
function updatePWLengthLabel() {
  document.getElementById('pw-length-label').textContent = document.getElementById('pw-length').value;
}

function generatePW() {
  var len = parseInt(document.getElementById('pw-length').value);
  var upper = document.getElementById('pw-upper').checked;
  var lower = document.getElementById('pw-lower').checked;
  var digits = document.getElementById('pw-digits').checked;
  var special = document.getElementById('pw-special').checked;
  var excludeSimilar = document.getElementById('pw-exclude-similar').checked;

  var chars = '';
  if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (lower) chars += 'abcdefghijklmnopqrstuvwxyz';
  if (digits) chars += '0123456789';
  if (special) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

  if (excludeSimilar) {
    chars = chars.replace(/[0O]/g, '').replace(/[1lI]/g, '');
  }

  if (!chars) {
    document.getElementById('pw-output').textContent = '⚠️ 请至少选择一种字符类型';
    return;
  }

  // Ensure at least one from each selected category
  var required = [];
  if (upper) required.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
  if (lower) required.push('abcdefghijklmnopqrstuvwxyz');
  if (digits) required.push('0123456789');
  if (special) required.push('!@#$%^&*()_+-=[]{}|;:,.<>?');

  var password = '';
  // Pick one from each required set first
  for (var i = 0; i < required.length; i++) {
    var set = required[i];
    if (excludeSimilar) set = set.replace(/[0O]/g, '').replace(/[1lI]/g, '');
    password += set.charAt(Math.floor(Math.random() * set.length));
  }
  // Fill remaining
  for (var j = password.length; j < len; j++) {
    password += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  // Shuffle using Fisher-Yates
  var arr = password.split('');
  for (var k = arr.length - 1; k > 0; k--) {
    var idx = Math.floor(Math.random() * (k + 1));
    var tmp = arr[k]; arr[k] = arr[idx]; arr[idx] = tmp;
  }
  password = arr.join('');

  document.getElementById('pw-output').textContent = password;

  // Calculate entropy and strength
  var poolSize = 0;
  if (upper) poolSize += 26;
  if (lower) poolSize += 26;
  if (digits) poolSize += 10;
  if (special) poolSize += 24;
  if (excludeSimilar) poolSize -= 6; // rough
  var entropy = Math.round(len * Math.log2(poolSize));

  var strengthText = '极弱';
  var strengthPct = 5;
  var color = '#ef4444';
  if (entropy >= 128) { strengthText = '极强'; strengthPct = 100; color = '#10b981'; }
  else if (entropy >= 80) { strengthText = '强'; strengthPct = 80; color = '#6366f1'; }
  else if (entropy >= 60) { strengthText = '中等'; strengthPct = 55; color = '#f59e0b'; }
  else if (entropy >= 40) { strengthText = '弱'; strengthPct = 30; color = '#f97316'; }
  else { strengthText = '极弱'; strengthPct = 10; color = '#ef4444'; }

  document.getElementById('pw-strength-text').textContent = strengthText + ' (' + entropy + ' bit)';
  document.getElementById('pw-strength-fill').style.width = strengthPct + '%';
  document.getElementById('pw-strength-fill').style.background = color;

  document.getElementById('pw-stats').innerHTML = '<span>📏 长度: ' + len + '</span><span>🔐 熵值: ' + entropy + ' bit</span><span>🧩 字符池: ' + poolSize + ' 种</span>';
}

function copyPW() {
  var text = document.getElementById('pw-output').textContent;
  if (!text || text.indexOf('⚠️') === 0) return;
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.getElementById('pw-copy-btn');
    btn.textContent = '✅ 已复制';
    setTimeout(function() { btn.textContent = '📋 复制密码'; }, 2000);
  }).catch(function() {});
}

function clearPW() {
  document.getElementById('pw-output').textContent = '';
  document.getElementById('pw-stats').textContent = '';
  document.getElementById('pw-strength-text').textContent = '';
  document.getElementById('pw-strength-fill').style.width = '0%';
}

// Generate on load
generatePW();
</script>

<div class="tool-meta">
  <p><strong>使用说明：</strong>滑动选择长度 → 勾选字符类型 → 密码自动生成。</p>
  <p><strong>强度指标：</strong>基于密码熵值（bits）计算。推荐密码熵值 &gt; 80 bit 为强。</p>
  <p><strong>排除相似：</strong>勾选后排除 <code>0O</code>、<code>1lI</code> 等易混淆字符。</p>
  <p><strong>安全提示：</strong>生成的密码仅在浏览器本地生成，不会上传网络。</p>
</div>
