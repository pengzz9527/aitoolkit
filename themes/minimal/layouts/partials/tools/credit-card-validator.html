<!-- 信用卡号验证器 Widget -->
<label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;color:var(--text);">信用卡号</label>
<input id="cc-number" class="tool-textarea" style="resize:none;height:38px;padding:8px 12px;margin-bottom:12px;" placeholder="输入信用卡号..." oninput="ccAutoValidate()">
<div class="btn-row">
  <button class="btn" onclick="ccValidate()">✅ 验证</button>
  <button class="btn btn-outline btn-sm" onclick="ccClear()">🗑️ 清空</button>
</div>
<div class="output-area" id="cc-output"></div>
<div class="stats-bar" id="cc-stats"></div>
<script>
function ccDetectIssuer(num){num=num.replace(/[\s-]/g,'');if(/^4[0-9]{12,18}$/.test(num))return'Visa';if(/^5[1-5][0-9]{14}$/.test(num))return'MasterCard';if(/^3[47][0-9]{13}$/.test(num))return'American Express';if(/^6(?:011|5[0-9]{2})[0-9]{12}$/.test(num))return'Discover';if(/^3(?:0[0-5]|[68][0-9])[0-9]{11}$/.test(num))return'Diners Club';if(/^(?:2131|1800|35[0-9]{3})[0-9]{11}$/.test(num))return'JCB';if(/^62[0-9]{14,17}$/.test(num))return'UnionPay';return'未知';}
function ccLuhnCheck(num){num=num.replace(/[\s-]/g,'');if(!/^\d+$/.test(num))return false;var sum=0,alt=false;for(var i=num.length-1;i>=0;i--){var d=parseInt(num[i]);if(alt){d*=2;if(d>9)d-=9;}sum+=d;alt=!alt;}return sum%10===0;}
function ccValidate(){var num=document.getElementById('cc-number').value.trim();var out=document.getElementById('cc-output');var stats=document.getElementById('cc-stats');if(!num){out.textContent='⚠️ 请输入信用卡号';stats.textContent='';return;}
var clean=num.replace(/[\s-]/g,'');if(!/^\d+$/.test(clean)){out.textContent='❌ 卡号包含非法字符';stats.innerHTML='<span style="color:#dc2626">❌ 无效字符</span>';return;}
var valid=ccLuhnCheck(clean);var issuer=ccDetectIssuer(clean);if(valid){out.innerHTML='✅ <strong>卡号有效</strong> — '+issuer;stats.innerHTML='<span style="color:#16a34a">✅ Luhn 校验通过</span><span>🏦 发卡行: '+issuer+'</span><span>📏 位数: '+clean.length+'</span>';}
else{out.innerHTML='❌ <strong>卡号无效</strong>';stats.innerHTML='<span style="color:#dc2626">❌ Luhn 校验失败</span><span>🏦 格式识别: '+issuer+'</span><span>📏 位数: '+clean.length+'</span>';}}
function ccAutoValidate(){var num=document.getElementById('cc-number').value.trim();if(num.length>8)ccValidate();}
function ccClear(){document.getElementById('cc-number').value='';document.getElementById('cc-output').textContent='';document.getElementById('cc-stats').textContent='';}
</script>
<div class="tool-meta">
  <p><strong>使用说明：</strong>输入信用卡号 → 自动验证，支持 Visa/MasterCard/Amex/Discover 等常见发卡行识别。</p>
  <p><strong>算法：</strong>Luhn 算法（ISO/IEC 7812）校验。</p>
  <p><strong>隐私说明：</strong>卡号仅在浏览器本地处理，不会上传。</p>
</div>
