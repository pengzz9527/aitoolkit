<!-- 颜色调色板生成器 Widget -->
<label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;color:var(--text);">主色 (Hex)</label>
<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;">
  <input type="color" id="cp-base" value="#6366f1" style="width:60px;height:40px;border:none;padding:0;cursor:pointer;" oninput="cpGenerate()">
  <input id="cp-hex" class="tool-textarea" style="flex:1;resize:none;height:38px;padding:8px 12px;" value="#6366f1" oninput="cpFromHex()">
</div>
<div class="btn-row">
  <button class="btn" onclick="cpGenerate()">🎨 生成配色方案</button>
  <button class="btn btn-outline btn-sm" id="cp-copy-btn" onclick="cpCopyCSS()">📋 复制 CSS</button>
</div>
<div class="output-area" id="cp-output"></div>
<div class="stats-bar" id="cp-stats"></div>
<script>
function cpFromHex(){var v=document.getElementById('cp-hex').value.trim();if(/^#[0-9a-f]{6}$/i.test(v)){document.getElementById('cp-base').value=v;cpGenerate();}}
function _cpRgb(hex){return[parseInt(hex.slice(1,3),16)/255,parseInt(hex.slice(3,5),16)/255,parseInt(hex.slice(5,7),16)/255];}
function _cpHsl(hex){var r=hex[0],g=hex[1],b=hex[2];var M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m,h,s,l=(M+m)/2;if(d===0)return[0,0,l];s=l>0.5?d/(2-M-m):d/(M+m);if(M===r)h=((g-b)/d+(g<b?6:0))/6;else if(M===g)h=((b-r)/d+2)/6;else h=((r-g)/d+4)/6;return[h*360,s,l];}
function _cpHexFromHsl(h,s,l){h/=360;var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h*6)%2-1)),m=l-c/2,r,g,b;if(h<1/6){r=c;g=x;b=0;}else if(h<2/6){r=x;g=c;b=0;}else if(h<3/6){r=0;g=c;b=x;}else if(h<4/6){r=0;g=x;b=c;}else if(h<5/6){r=x;g=0;b=c;}else{r=c;g=0;b=x;}
return'#'+[r,g,b].map(function(v){return Math.round((v+m)*255).toString(16).padStart(2,'0')}).join('');}
function cpGenerate(){var hex=document.getElementById('cp-base').value;document.getElementById('cp-hex').value=hex;
var rgb=_cpRgb(hex);var hsl=_cpHsl(rgb);var h=hsl[0],s=hsl[1],l=hsl[2];
var palettes=[
{name:'互补色',colors:[hex,_cpHexFromHsl((h+180)%360,s,l)]},
{name:'类似色',colors:[_cpHexFromHsl((h-30+360)%360,s,l),hex,_cpHexFromHsl((h+30)%360,s,l)]},
{name:'三角配色',colors:[hex,_cpHexFromHsl((h+120)%360,s,l),_cpHexFromHsl((h+240)%360,s,l)]},
{name:'分裂互补',colors:[hex,_cpHexFromHsl((h+150)%360,s,l),_cpHexFromHsl((h+210)%360,s,l)]},
{name:'单色渐变',colors:[_cpHexFromHsl(h,s,0.15),_cpHexFromHsl(h,s,0.35),_cpHexFromHsl(h,s,0.5),_cpHexFromHsl(h,s,0.7),_cpHexFromHsl(h,s,0.85)]}];
var html='';palettes.forEach(function(p){html+='<div style="margin-bottom:10px;"><strong style="font-size:0.8rem;color:var(--text-secondary);display:block;margin-bottom:4px;">'+p.name+'</strong><div style="display:flex;gap:4px;border-radius:6px;overflow:hidden;">';
p.colors.forEach(function(c){var br=parseInt(c.slice(1,3),16)*0.299+parseInt(c.slice(3,5),16)*0.587+parseInt(c.slice(5,7),16)*0.114;html+='<div style="flex:1;height:40px;background:'+c+';display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:0.65rem;font-family:monospace;color:'+(br>128?'#333':'#fff')+';">'+c+'</div>';});
html+='</div></div>';});
document.getElementById('cp-output').innerHTML=html;document.getElementById('cp-stats').innerHTML='<span>🎨 5 种配色方案</span><span>📏 主色: '+hex+'</span>';}
function cpCopyCSS(){var hex=document.getElementById('cp-base').value;var rgb=_cpRgb(hex);var hsl=_cpHsl(rgb);var css='--primary: '+hex+';\n--primary-light: '+_cpHexFromHsl(hsl[0],0.8,0.9)+';\n--primary-dark: '+_cpHexFromHsl(hsl[0],0.9,0.3)+';\n';
navigator.clipboard.writeText(css).then(function(){var b=document.getElementById('cp-copy-btn');b.textContent='✅ 已复制';setTimeout(function(){b.textContent='📋 复制 CSS';},2000);}).catch(function(){});}
cpGenerate();
</script>
<div class="tool-meta">
  <p><strong>使用说明：</strong>选择主色 → 自动生成互补/类似/三角/分裂互补/单色渐变 5 种配色方案。</p>
  <p><strong>适用场景：</strong>UI 设计、数据可视化配色、品牌配色方案设计。</p>
</div>
