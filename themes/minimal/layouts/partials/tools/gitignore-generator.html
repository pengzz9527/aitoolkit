<div class="btn-row">
  <button class="btn" onclick="generateGitignore()">📄 生成 .gitignore</button>
  <button class="btn btn-outline btn-sm" onclick="giSelectAll()">全选</button>
  <button class="btn btn-outline btn-sm" onclick="giDeselectAll()">取消全选</button>
  <button class="btn btn-outline btn-sm" id="gi-copy-btn" onclick="copyGitignore()">📋 复制</button>
  <button class="btn btn-outline btn-sm" onclick="downloadGitignore()">📥 下载</button>
</div>
<pre class="output-area" id="gi-output"></pre>
<div class="stats-bar" id="gi-stats"></div>
<script>
var _giTemplates = {
  'Node': 'node_modules/\nnpm-debug.log*\nyarn-debug.log*\nyarn-error.log*\n.yarn/\n.yarn-integrity\n.pnp.*\n',
  'Python': '__pycache__/\n*.py[cod]\n*$py.class\n*.so\n.Python\nenv/\nvenv/\n.venv/\n*.egg-info/\n.eggs/\ndist/\nbuild/\n*.egg\n.ropeproject/\n.mypy_cache/\n.pytest_cache/\n',
  'Java': '*.class\n*.jar\n*.war\n*.nar\n*.ear\nhs_err_pid*\n.gradle/\nbuild/\n!gradle/wrapper/gradle-wrapper.jar\ntarget/\n*.iml\n.idea/\n*.ipr\n*.iws\n.settings/\n.classpath\n.project\n',
  'Go': '*.exe\n*.exe~\n*.dll\n*.so\n*.dylib\n*.test\n*.out\nvendor/\n.idea/\n.vscode/\n*.iml\n',
  'Rust': 'target/\n**/*.rs.bk\nCargo.lock\n',
  'Ruby': '*.gem\n.bundle/\nGemfile.lock\nvendor/bundle/\n.bundler/\n',
  'PHP': 'vendor/\ncomposer.lock\n.phpunit.result.cache\n.php_cs.cache\n.env\n*.log\n',
  'Swift': '.build/\n*.pbxuser\n!default.pbxuser\n*.mode1v3\n!default.mode1v3\n*.mode2v3\n!default.mode2v3\n*.perspectivev3\n!default.perspectivev3\nxcuserdata/\n*.xccheckout\n*.moved-aside\nDerivedData/\n*.hmap\n*.ipa\n*.xcworkspace\nPods/\n',
  'Kotlin': '*.class\n*.jar\n*.war\n*.nar\n*.ear\n.gradle/\nbuild/\ntarget/\n!gradle/wrapper/gradle-wrapper.jar\n.idea/\n*.iml\nlocal.properties\n',
  'C++': '*.o\n*.obj\n*.exe\n*.dll\n*.so\n*.dylib\n*.out\n*.app\nbuild/\nDebug/\nRelease/\nx64/\n.sconsign.dblite\n',
  'C#': 'bin/\nobj/\n*.user\n*.suo\n*.cache\n*.log\n*.vs/\n.vscode/\npackages/\n*.nupkg\n',
  'Dart': '.dart_tool/\n.packages\n.pub/\nbuild/\n.flutter-plugins\n.flutter-plugins-dependencies\n*.iml\n.idea/\n.dart_language_server\n*.js_\n*.js.deps\n',
  'React': 'node_modules/\nbuild/\n*.log\n.env.local\n.env.development.local\n.env.test.local\n.env.production.local\nnpm-debug.log*\nyarn-debug.log*\nyarn-error.log*\n',
  'Vue': 'node_modules/\ndist/\n*.log\n.env.local\n',
  'Angular': 'node_modules/\ndist/\n*.log\n.env\n',
  'Django': '*.pyc\n__pycache__/\n*.sqlite3\nmedia/\nstaticfiles/\n.venv/\n*.log\nlocal_settings.py\n',
  'Flask': '*.pyc\n__pycache__/\ninstance/\n.webassets-cache\n.env\n*.db\n',
  'Rails': '*.rbc\n.bundle/\nlog/\ntmp/\npublic/assets/\npublic/packs/\n.env\n*.sqlite3\n',
  'Laravel': 'node_modules/\nvendor/\n.env\n*.log\nstorage/\npublic/storage/\n.bootstrap/\n',
  'Spring': '.gradle/\nbuild/\ntarget/\n!.mvn/wrapper/maven-wrapper.jar\n*.jar\n*.war\n*.iml\n.idea/\n*.class\n',
  'Next.js': 'node_modules/\n.next/\nout/\n*.log\n.env*.local\n',
  'VSCode': '.vscode/\n*.code-workspace\n',
  'JetBrains': '.idea/\n*.iml\n*.iws\n*.ipr\nout/\n.idea_modules/\n',
  'Xcode': '*.pbxuser\n!default.pbxuser\n*.mode1v3\n!default.mode1v3\n*.mode2v3\n!default.mode2v3\n*.perspectivev3\n!default.perspectivev3\nxcuserdata/\n*.xccheckout\n*.moved-aside\nDerivedData/\n*.hmap\n*.ipa\n*.xcworkspace\n',
  'macOS': '.DS_Store\n.AppleDouble\n.LSOverride\nIcon\r\n._*\n.DocumentRevisions-V100/\n.fseventsd/\n.Spotlight-V100/\n.TemporaryItems/\n.Trashes/\n.VolumeIcon.icns\n.com.apple.timemachine.donotpresent\n',
  'Windows': 'Thumbs.db\nehthumbs.db\nDesktop.ini\n$RECYCLE.BIN/\n*.cab\n*.msi\n*.msm\n*.msp\n',
  'Linux': '*~\n*.swp\n*.swo\n*.swn\n*.bak\n',
  'Docker': '.docker/\n*.dockerignore\n*.yml.bak\n',
};

function generateGitignore(){
  var checks = document.querySelectorAll('.gi-check:checked');
  var content = '# .gitignore - Generated by AI Toolkit\n# https://www.toptal.com/developers/gitignore\n\n';
  var selected = [];
  checks.forEach(function(cb){selected.push(cb.value);});
  if(selected.length===0){content += '# 请选择语言/框架/环境\n';}
  selected.forEach(function(name){
    content += '# === '+name+' ===\n';
    if(_giTemplates[name]){
      content += _giTemplates[name];
    } else {
      content += '# '+name+' (自定义)\n';
    }
    content += '\n';
  });
  // Common ignores
  content += '# === Common ===\n.env\n*.log\n.DS_Store\nThumbs.db\n*.swp\n*.swo\n*~\n';
  document.getElementById('gi-output').textContent = content;
  document.getElementById('gi-stats').innerHTML = '<span>✅ 已生成</span><span>📋 '+selected.length+' 个模板</span><span>📏 '+content.length+' 字符</span>';
}

function giSelectAll(){document.querySelectorAll('.gi-check').forEach(function(cb){cb.checked=true;});generateGitignore();}
function giDeselectAll(){document.querySelectorAll('.gi-check').forEach(function(cb){cb.checked=false;});generateGitignore();}
document.querySelectorAll('.gi-check').forEach(function(cb){cb.addEventListener('change',generateGitignore);});

function copyGitignore(){
  var text=document.getElementById('gi-output').textContent;
  if(!text||text.indexOf('⚠️')===0)return;
  navigator.clipboard.writeText(text).then(function(){var b=document.getElementById('gi-copy-btn');b.textContent='✅ 已复制';setTimeout(function(){b.textContent='📋 复制';},2000);}).catch(function(){});
}

function downloadGitignore(){
  var text=document.getElementById('gi-output').textContent;
  if(!text)return;
  var blob=new Blob([text],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='.gitignore';a.click();URL.revokeObjectURL(a.href);
}

generateGitignore();
</script>
<div class="tool-meta">
  <p><strong>使用说明：</strong>勾选需要的语言、框架、工具和 IDE，自动生成对应的 .gitignore 文件。</p>
  <p><strong>适用场景：</strong>新建项目时快速生成 .gitignore、统一团队 Git 配置。</p>
  <p><strong>隐私说明：</strong>所有数据仅在浏览器本地处理，不会上传到任何服务器。</p>
</div>
