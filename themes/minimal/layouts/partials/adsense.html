{{ if .Site.Params.enable_ads }}
{{ if and (ne .Site.Params.adsense_publisher_id "ca-pub-XXXXXXXXXXXXXXXX") (gt (len .Site.Params.adsense_publisher_id) 10) }}
{{/* ===== Google AdSense Auto Ads ===== */}}
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ .Site.Params.adsense_publisher_id }}"
     crossorigin="anonymous"></script>
<script>
  (adsbygoogle = window.adsbygoogle || []).push({
    google_ad_client: "{{ .Site.Params.adsense_publisher_id }}",
    enable_page_level_ads: true,
    overlays: {bottom: true}
  });
</script>
{{ end }}
{{ end }}
